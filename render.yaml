# Render blueprint: in Render, New -> Blueprint -> pick this repo.
# Every push to main redeploys automatically.
services:
  - type: web
    name: playbee
    runtime: node
    plan: starter # the free plan has no disk, so games and pictures would vanish on restart
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/home
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: playbee-data
      mountPath: /var/data # database + uploaded pictures live here and survive deploys
      sizeGB: 1
    domains:
      - playbee.pro
      - www.playbee.pro
